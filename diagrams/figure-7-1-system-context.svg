<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" font-family="Helvetica, Arial, sans-serif"><title>Figure 7.1. System context</title><desc>Figure 7.1. System context. Editable source supplied in farm-direct-architecture.drawio.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526A7C"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526A7C" stroke-width="1.5"/></marker></defs><rect x="435" y="325" width="630" height="365" rx="8" fill="#F8FAFC" stroke="#526A7C" stroke-width="1.7" stroke-dasharray="9 6"/><path d="M 345 495 L 485 495" fill="none" stroke="#526A7C" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M 1155 495 L 1015 495" fill="none" stroke="#526A7C" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M 750 270 L 750 395" fill="none" stroke="#526A7C" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="750.0" y="45" text-anchor="middle" fill="#24384A" font-size="29" font-weight="700"><tspan x="750.0" dy="0">Figure 7.1. System context</tspan></text><text x="750.0" y="78" text-anchor="middle" fill="#526A7C" font-size="17" font-weight="400"><tspan x="750.0" dy="0">Target shared system — external roles and system boundary</tspan></text><text x="455" y="356" text-anchor="start" fill="#24384A" font-size="21" font-weight="700"><tspan x="455" dy="0">System under development</tspan></text><rect x="485" y="395" width="530" height="215" rx="12" fill="#EAF2F9" stroke="#526A7C" stroke-width="2"/><text x="750.0" y="448.21999999999997" text-anchor="middle" fill="#24384A" font-size="23" font-weight="400"><tspan x="750.0" dy="0">Farm Direct Procurement System</tspan><tspan x="750.0" dy="31.05">[Software system]</tspan><tspan x="750.0" dy="31.05"></tspan><tspan x="750.0" dy="31.05">Products, farmer offers, orders,</tspan><tspan x="750.0" dy="31.05">pricing transparency and moderation</tspan></text><rect x="55" y="410" width="290" height="170" rx="12" fill="#EAF4EF" stroke="#526A7C" stroke-width="2"/><text x="200.0" y="474.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="200.0" dy="0">Buyer</tspan><tspan x="200.0" dy="27.0">[Person]</tspan><tspan x="200.0" dy="27.0">Finds offers and places orders</tspan></text><rect x="1155" y="410" width="290" height="170" rx="12" fill="#EAF4EF" stroke="#526A7C" stroke-width="2"/><text x="1300.0" y="461.3" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="1300.0" dy="0">Farmer</tspan><tspan x="1300.0" dy="27.0">[Person]</tspan><tspan x="1300.0" dy="27.0">Publishes offers and</tspan><tspan x="1300.0" dy="27.0">fulfils orders</tspan></text><rect x="590" y="120" width="320" height="150" rx="12" fill="#EAF4EF" stroke="#526A7C" stroke-width="2"/><text x="750.0" y="174.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="750.0" dy="0">Administrator</tspan><tspan x="750.0" dy="27.0">[Person]</tspan><tspan x="750.0" dy="27.0">Moderates accounts and offers</tspan></text><rect x="369.28" y="418" width="89.44" height="53.900000000000006" rx="3" fill="white"/><text x="414" y="435" text-anchor="middle" fill="#24384A" font-size="17" font-weight="400"><tspan x="414" dy="0">Browse /</tspan><tspan x="414" dy="22.950000000000003">order</tspan></text><rect x="1036.69" y="418" width="98.62" height="53.900000000000006" rx="3" fill="white"/><text x="1086" y="435" text-anchor="middle" fill="#24384A" font-size="17" font-weight="400"><tspan x="1086" dy="0">Publish /</tspan><tspan x="1086" dy="22.950000000000003">fulfil</tspan></text><rect x="788.97" y="288" width="172.06" height="30.950000000000003" rx="3" fill="white"/><text x="875" y="305" text-anchor="middle" fill="#24384A" font-size="17" font-weight="400"><tspan x="875" dy="0">Moderate / review</tspan></text><text x="750" y="748" text-anchor="middle" fill="#526A7C" font-size="18" font-weight="400"><tspan x="750" dy="0">Arrows represent interactions initiated by each role; information is returned by the system.</tspan></text><rect x="170" y="790" width="1160" height="95" rx="12" fill="#FFF7E8" stroke="#526A7C" stroke-width="2"/><text x="750.0" y="831.135" text-anchor="middle" fill="#24384A" font-size="19" font-weight="400"><tspan x="750.0" dy="0">The current prototype operates on one device. Shared server operation is planned.</tspan><tspan x="750.0" dy="25.650000000000002">Payments and courier services are not integrated in the initial scope.</tspan></text></svg>