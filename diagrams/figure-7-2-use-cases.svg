 105 895 L 105 950 M 74 918 L 136 918 M 105 950 L 78 988 M 105 950 L 132 988"/></g><text x="105" y="1021" text-anchor="middle" fill="#24384A" font-size="22" font-weight="700"><tspan x="105" dy="0">Administrator</tspan></text><ellipse cx="490.0" cy="247.5" rx="150.0" ry="42.5" fill="#EAF4EF" stroke="#526A7C" stroke-width="2"/><text x="490.0" y="240.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="490.0" dy="0">Browse products</tspan><tspan x="490.0" dy="27.0">and compare offers</tspan></text><ellipse cx="850.0" cy="247.5" rx="150.0" ry="42.5" fill="#EAF4EF" stroke="#526A7C" stroke-width="2"/><text x="850.0" y="254.3" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="850.0" dy="0">Place an order</tspan></text><ellipse cx="1210.0" cy="247.5" rx="150.0" ry="42.5" fill="#EAF4EF" stroke="#526A7C" stroke-width="2"/><text x="1210.0" y="240.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="1210.0" dy="0">View / cancel</tspan><tspan x="1210.0" dy="27.0">own orders</tspan></text><ellipse cx="490.0" cy="392.5" rx="150.0" ry="42.5" fill="#EAF4EF" stroke="#526A7C" stroke-width="2"/><text x="490.0" y="385.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="490.0" dy="0">View offer-price</tspan><tspan x="490.0" dy="27.0">history</tspan></text><ellipse cx="850.0" cy="392.5" rx="150.0" ry="42.5" fill="#EAF4EF" stroke="#526A7C" stroke-width="2"/><text x="850.0" y="385.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="850.0" dy="0">Calculate and display</tspan><tspan x="850.0" dy="27.0">order total</tspan></text><ellipse cx="490.0" cy="597.5" rx="150.0" ry="42.5" fill="#EAF4EF" stroke="#526A7C" stroke-width="2"/><text x="490.0" y="590.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="490.0" dy="0">Create / edit</tspan><tspan x="490.0" dy="27.0">farmer offers</tspan></text><ellipse cx="850.0" cy="597.5" rx="150.0" ry="42.5" fill="#EAF4EF" stroke="#526A7C" stroke-width="2"/><text x="850.0" y="590.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="850.0" dy="0">Confirm / mark ready /</tspan><tspan x="850.0" dy="27.0">complete own orders</tspan></text><ellipse cx="1210.0" cy="597.5" rx="150.0" ry="42.5" fill="#EAF4EF" stroke="#526A7C" stroke-width="2"/><text x="1210.0" y="590.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="1210.0" dy="0">Reject an order</tspan><tspan x="1210.0" dy="27.0">with a reason</tspan></text><ellipse cx="490.0" cy="912.5" rx="150.0" ry="42.5" fill="#EAF2F9" stroke="#526A7C" stroke-width="2"/><text x="490.0" y="905.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="490.0" dy="0">Block / unblock</tspan><tspan x="490.0" dy="27.0">accounts</tspan></text><ellipse cx="850.0" cy="912.5" rx="150.0" ry="42.5" fill="#EAF2F9" stroke="#526A7C" stroke-width="2"/><text x="850.0" y="905.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="850.0" dy="0">Hide / restore</tspan><tspan x="850.0" dy="27.0">offers</tspan></text><ellipse cx="1210.0" cy="912.5" rx="150.0" ry="42.5" fill="#EAF2F9" stroke="#526A7C" stroke-width="2"/><text x="1210.0" y="905.8" text-anchor="middle" fill="#24384A" font-size="20" font-weight="400"><tspan x="1210.0" dy="0">Review orders and</tspan><tspan x="1210.0" dy="27.0">moderation records</tspan></text><rect x="884.69" y="311" width="98.62" height="30.950000000000003" rx="3" fill="white"/><text x="934" y="328" text-anchor="middle" fill="#24384A" font-size="17" font-weight="400"><tspan x="934" dy="0">«include»</tspan></text><rect x="270" y="1035" width="1150" height="75" rx="12" fill="#F8FAFC" stroke="#526A7C" stroke-width="2"/><text x="845.0" y="1066.805" text-anchor="middle" fill="#24384A" font-size="17" font-weight="400"><tspan x="845.0" dy="0">Authentication and role / ownership checks are preconditions for protected actions (FR-01–03).</tspan><tspan x="845.0" dy="22.950000000000003">«include» means every order placement includes calculation and disclosure of the total.</tspan></text></svg>